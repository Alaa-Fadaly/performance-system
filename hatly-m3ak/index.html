<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>هاتلى معاك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF6E0; --ink:#2A1F4D; --muted:#7C7399; --card:#fff;
  --pink:#FF5C8A; --yellow:#FFC93C; --mint:#1FC8A5; --blue:#4D8DFF; --purple:#7B5CFF; --orange:#FF8A3D;
  --line:#F0E3C4; --r:22px;
  --shadow:0 6px 0 rgba(42,31,77,.10), 0 10px 24px rgba(42,31,77,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;
  background-image:radial-gradient(circle at 10% 0,#FFE9A8 0,transparent 35%),radial-gradient(circle at 100% 30%,#FFD3E1 0,transparent 30%);
  background-attachment:fixed;padding-bottom:150px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* header */
header{background:linear-gradient(135deg,var(--purple),var(--pink) 70%,var(--orange));color:#fff;
  border-radius:0 0 34px 34px;padding:18px 0 26px;box-shadow:0 10px 0 rgba(123,92,255,.18);position:relative;overflow:hidden}
header:before,header:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14)}
header:before{width:140px;height:140px;top:-50px;left:-30px}
header:after{width:90px;height:90px;bottom:-30px;right:30%}
.brand{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.logo{font-size:38px;background:#fff;border-radius:18px;width:62px;height:62px;display:grid;place-items:center;
  box-shadow:0 5px 0 rgba(0,0,0,.15);transform:rotate(-6deg);animation:wob 3s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(6deg) translateY(-3px)}}
.brand h1{margin:0;white-space:nowrap;font-size:26px;font-weight:900;line-height:1.1}
.brand p{margin:2px 0 0;font-size:13px;opacity:.92;font-weight:600}
.who{margin-inline-start:auto;max-width:42%;background:rgba(255,255,255,.22);padding:7px 12px;border-radius:14px;font-size:12.5px;font-weight:700;
  text-align:center;position:relative;z-index:1;line-height:1.3}
.who b{display:block;font-size:14px}

/* vendor chips */
.vendors{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 12px}
.vchip{background:#fff;border-radius:18px;padding:12px 8px;font-weight:800;font-size:15px;box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;gap:8px;border:3px solid transparent;transition:.15s}
.vchip .e{font-size:24px}
.vchip.on.foul{background:var(--yellow);border-color:var(--ink)}
.vchip.on.super{background:var(--mint);border-color:var(--ink);color:#05342b}
.vchip:active{transform:translateY(3px)}

/* status */
.banner{border-radius:18px;padding:12px 14px;font-weight:700;font-size:14px;display:flex;gap:10px;align-items:center;margin-bottom:12px}
.banner.open{background:#D9F8EE;color:#07654f}
.banner.closed{background:#FFE5CC;color:#8a3f00}
.banner.done{background:#E6E0FF;color:#3b2a9c}
.banner .e{font-size:24px}

/* cats */
.cats{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;background:#fff;border-radius:999px;padding:7px 16px;font-weight:700;font-size:14px;border:2px solid var(--line)}
.cat.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* menu grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.item{background:var(--card);border-radius:var(--r);padding:14px 10px 12px;text-align:center;box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;gap:6px;border:3px solid transparent;position:relative;transition:.15s}
.item.has{border-color:var(--ink);transform:translateY(-2px)}
.bub{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-size:36px}
.item h3{margin:0;font-size:15px;font-weight:800;line-height:1.3;min-height:40px;display:flex;align-items:center}
.desc{font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.35;margin-top:-4px}
.price{color:var(--muted);font-weight:700;font-size:13px}
.step{display:flex;align-items:center;gap:8px;margin-top:2px}
.step button{width:36px;height:36px;border-radius:12px;font-size:22px;font-weight:900;line-height:1;background:var(--yellow);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.step button.m{background:#FFE0E8}
.step button:active{transform:translateY(2px);box-shadow:none}
.step span{min-width:24px;font-weight:900;font-size:18px}
.item.custom{border:3px dashed #cdbff7;background:#F5F1FF;justify-content:center;font-weight:800;color:var(--purple)}
.item.custom .bub{background:#fff}
.disabled .step button{opacity:.4;pointer-events:none}

/* cart bar + nav */
.cartbar{position:fixed;inset-inline:12px;bottom:84px;z-index:20;max-width:736px;margin:auto;background:var(--ink);color:#fff;
  border-radius:20px;padding:10px 12px 10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(42,31,77,.35);
  animation:pop .25s}
@keyframes pop{from{transform:translateY(30px);opacity:0}}
.cartbar .t{font-weight:800;font-size:14px;line-height:1.3}
.cartbar .t small{display:block;opacity:.75;font-weight:600}
.cartbar .go{margin-inline-start:auto;background:var(--yellow);color:var(--ink);font-weight:900;border-radius:14px;padding:10px 16px}
nav{position:fixed;inset-inline:0;bottom:0;z-index:30;background:#fff;border-radius:26px 26px 0 0;box-shadow:0 -6px 24px rgba(42,31,77,.12);
  display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
nav button{background:none;flex:1;max-width:200px;border-radius:18px;padding:6px 2px;font-weight:800;font-size:12px;line-height:1.2;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:0}
nav button .e{font-size:24px;transition:.2s}
nav button.on{background:#FFF0B8;color:var(--ink)}
nav button.on .e{transform:scale(1.2) rotate(-6deg)}

/* cards */
.card{background:#fff;border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:18px;font-weight:900;display:flex;align-items:center;gap:8px}
.card h2 .cnt{margin-inline-start:auto;background:var(--yellow);border-radius:999px;font-size:13px;padding:2px 10px}
.empty{text-align:center;color:var(--muted);padding:22px 10px;font-weight:700}
.empty .e{font-size:42px;display:block}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:2px dashed var(--line)}
.row:last-child{border:0;padding-bottom:0}
.row .nm{font-weight:800}
.row .sub{font-size:12.5px;color:var(--muted);font-weight:600}
.row .end{margin-inline-start:auto;text-align:left;font-weight:800;display:flex;align-items:center;gap:8px}
.qty{background:var(--pink);color:#fff;border-radius:12px;min-width:34px;height:34px;display:grid;place-items:center;font-weight:900;flex:none;padding:0 6px}
.kind{display:flex;justify-content:space-between;align-items:center;border-radius:12px;padding:6px 12px;margin:10px 0 2px;font-weight:900;font-size:14px}
.kind span{background:var(--ink);color:#fff;border-radius:999px;padding:0 10px;font-size:13px}
.tag{display:inline-block;background:#EFE9FF;color:var(--purple);border-radius:999px;padding:1px 8px;font-size:11px;font-weight:800;vertical-align:middle}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:#EFE9FF;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700}
.chip.me{background:var(--yellow)}
.chip small{opacity:.7;font-weight:600}
.x{background:#FFE0E8;color:#b0093a;width:32px;height:32px;border-radius:10px;font-weight:900}
.total{display:flex;justify-content:space-between;align-items:center;background:#FFF0B8;border-radius:14px;padding:10px 14px;font-weight:900;margin-top:10px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800}
.pill.est{background:#FFE5CC;color:#8a3f00}
.pill.ok{background:#D9F8EE;color:#07654f}
.pill.no{background:#FFE0E8;color:#b0093a}

/* buttons */
.btn{background:var(--purple);color:#fff;border-radius:16px;padding:12px 18px;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.18);transition:.1s}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.y{background:var(--yellow);color:var(--ink)}
.btn.g{background:var(--mint);color:#05342b}
.btn.r{background:var(--pink)}
.btn.o{background:#fff;color:var(--ink);border:2px solid var(--ink);box-shadow:none}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:12px}
.btn.full{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* forms */
label{display:block;font-weight:800;font-size:13.5px;margin:12px 0 5px}
input,select,textarea{width:100%;background:#FBF8FF;border:2px solid #DCD2FF;border-radius:14px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--purple);background:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pin{letter-spacing:8px;text-align:center;font-size:24px;font-weight:900}

/* sheet / modal */
.ov{position:fixed;inset:0;background:rgba(42,31,77,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:#fff;width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:30px 30px 0 0;padding:18px 18px 28px;animation:up .25s}
@keyframes up{from{transform:translateY(60px)}}
.sheet h2{margin:0 0 4px;font-size:21px;font-weight:900}
.sheet .hint{color:var(--muted);font-weight:600;font-size:13.5px;margin:0 0 6px}
.center{align-items:center;padding:16px}
.center .sheet{border-radius:30px}

.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:16px;
  font-weight:800;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:pop .2s;max-width:90vw;text-align:center}
.toast.err{background:#d6245a}
.spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* courier */
.steps{display:flex;gap:6px;margin-bottom:10px}
.stp{flex:1;text-align:center;padding:8px 4px;border-radius:14px;background:#F1ECFF;font-weight:800;font-size:12.5px;color:var(--muted)}
.stp.on{background:var(--purple);color:#fff}
.stp.past{background:#D9F8EE;color:#07654f}
.ptable .row{gap:8px}
.ptable input{width:84px;text-align:center;padding:8px;font-weight:800}
.bill{border:3px solid var(--line);border-radius:18px;padding:12px;margin-bottom:12px;background:#fffdf7}
.bill.paid{border-color:var(--mint);background:#EFFFF9}
.bill .hd{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.loc{background:var(--blue);color:#fff;border-radius:12px;padding:4px 10px;font-weight:900;font-size:13px;line-height:1.35;text-align:center}
.bill .ln{display:flex;justify-content:space-between;font-size:14px;font-weight:600;padding:2px 0}
.bill .tot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-weight:900;font-size:18px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sum div{border-radius:16px;padding:10px 6px;text-align:center;font-weight:800;font-size:12.5px}
.sum b{display:block;font-size:19px}
details{margin-bottom:14px}
summary{cursor:pointer;font-weight:900;font-size:17px;background:#fff;border-radius:var(--r);padding:14px;box-shadow:var(--shadow);list-style:none}
summary::-webkit-details-marker{display:none}
details[open] summary{border-radius:var(--r) var(--r) 0 0;box-shadow:none}
details .inner{background:#fff;padding:0 14px 14px;border-radius:0 0 var(--r) var(--r);box-shadow:var(--shadow)}
.hide{display:none!important}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="brand">
    <div class="logo">🛵</div>
    <div><h1>هاتلى معاك</h1><p>فطار المبنى في أوردر واحد 😋</p></div>
    <button class="who" id="who" data-act="profile"></button>
  </div>
</div></header>

<main class="wrap" id="app"></main>
<div id="cartbar"></div>
<nav id="nav"></nav>
<div id="layer"></div>

<script>
/* ======================= ثوابت ======================= */
const VENDORS = {
  foul:  { name: 'مطعم الفول والطعمية', short: 'فول وطعمية', emoji: '🧆' },
  super: { name: 'السوبرماركت',        short: 'سوبرماركت',  emoji: '🛒' }
};
const BUBBLES = ['#FFE9A8', '#FFD3E1', '#CFF5EA', '#D6E4FF', '#E6DDFF', '#FFDCC2'];
const STATUS_TXT = {
  open:   ['🟢', 'الأوردر مفتوح — ضيف اللي نفسك فيه'],
  closed: ['🛵', 'الأوردر اتقفل — مسئول التوصيل راح يطلبه'],
  done:   ['🎉', 'الأوردر وصل — مسئول التوصيل بيحاسب الناس']
};

/* ======================= الحالة ======================= */
const S = {
  me: load('hm_profile'), menu: [], orders: {}, tab: 'order', vendor: 'foul', cat: 'all',
  cart: [], hist: [], vr: {}, pin: sessionGet('hm_pin'), prices: {}, fee: {}, today: '', loaded: false, busy: false
};

function load(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
function store(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function sessionGet(k){ try { return sessionStorage.getItem(k); } catch(e){ return null; } }
function sessionSet(k,v){ try { v==null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k,v); } catch(e){} }

/* ======================= أدوات ======================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (Math.round((Number(n)||0)*100)/100).toString() + ' ج';
const normKey = s => String(s||'').trim().replace(/\s+/g,' ');
const rounds = v => (S.orders[v] && S.orders[v].rounds) || [{ round:1, status:'open', fee:0, lines:[] }];
const ord = v => { const r = rounds(v); return r[r.length - 1]; };              // الجولة الحالية (للموظفين)
const cv = v => rounds(v).find(r => r.round === S.vr[v]) || ord(v);              // الجولة المعروضة للمسئول
const pk = v => v + ':' + cv(v).round;
const floorLabel = f => f < 0 ? 'البدروم' : f === 0 ? 'الأرضي' : 'دور ' + f;

function call(fn, ...args){
  return new Promise((ok, bad) => {
    if (!window.google || !google.script) return bad(new Error('مفيش اتصال بالسيرفر'));
    google.script.run.withSuccessHandler(ok)
      .withFailureHandler(e => bad(new Error((e && e.message || String(e)).replace(/^Error:\s*/,'')))) [fn](...args);
  });
}
function toast(msg, err){
  const t = document.createElement('div');
  t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
async function run(p, okMsg){
  try { const r = await p; if (okMsg) toast(okMsg); return r; }
  catch(e){ toast(e.message, true); throw e; }
}
function copyText(text){
  const done = () => toast('اتنسخ ✅');
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done, () => fallback());
  } else fallback();
  function fallback(){
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch(e){ toast('مقدرتش أنسخ', true); }
    ta.remove();
  }
}

/* ======================= تحميل البيانات ======================= */
async function refresh(silent){
  try {
    const st = await call('getState', S.me ? S.me.id : '');
    S.menu = st.menu; S.orders = st.orders; S.today = st.today; S.loaded = true;
    render();
    if (S.me && (!S._histAt || Date.now() - S._histAt > 120000)) loadHist();
  } catch(e){ if (!silent) toast(e.message, true); S.loaded = true; render(); }
}

async function loadHist(){
  if (!S.me) return;
  S._histAt = Date.now();
  try { S.hist = await call('getHistory', S.me.id); if (S.tab === 'order' || S.tab === 'hist') render(); } catch(e){}
}

/* ======================= الرسم ======================= */
function render(){
  $('#who').innerHTML = S.me ? `<b>${esc(S.me.name)}</b>${floorLabel(S.me.floor)} · مكتب ${esc(S.me.office)}` : 'سجّل بياناتك';
  $('#nav').innerHTML = [['order','🍳','اطلب'],['group','🧾','الأوردر'],['hist','📜','سجلّي'],['courier','🛵','مسئول التوصيل']]
    .map(([k,e,t]) => `<button class="${S.tab===k?'on':''}" data-act="tab" data-v="${k}"><span class="e">${e}</span>${t}</button>`).join('');
  if (!S.loaded) { $('#app').innerHTML = '<div class="empty"><span class="e spin">🥙</span>ثواني بنجهز الفطار…</div>'; $('#cartbar').innerHTML=''; return; }
  $('#app').innerHTML = S.tab === 'order' ? viewOrder() : S.tab === 'group' ? viewGroup() : S.tab === 'hist' ? viewHist() : viewCourier();
  renderCartBar();
}

function vendorChips(){
  return `<div class="vendors">${Object.keys(VENDORS).map(v =>
    `<button class="vchip ${v} ${S.vendor===v?'on':''}" data-act="vendor" data-v="${v}"><span class="e">${VENDORS[v].emoji}</span>${VENDORS[v].short}</button>`).join('')}</div>`;
}
function banner(v){
  const [e,t] = STATUS_TXT[ord(v).status] || STATUS_TXT.open;
  const n = rounds(v).length > 1 ? ` <span class="pill" style="background:#fff">الجولة ${ord(v).round}</span>` : '';
  const wait = ord(v).status !== 'open' ? '<br><small>لو عايز تطلب، استنى مسئول التوصيل يبدأ جولة جديدة</small>' : '';
  return `<div class="banner ${ord(v).status}"><span class="e">${e}</span><span>${t}${n}${wait}</span></div>`;
}

/* ---------- اطلب ---------- */
function cartQty(id){ const c = S.cart.find(x => x.key === id); return c ? c.qty : 0; }

function viewOrder(){
  const v = S.vendor, items = S.menu.filter(m => m.vendor === v);
  const cats = [...new Set(items.map(m => m.category))];
  if (S.cat !== 'all' && !cats.includes(S.cat)) S.cat = 'all';
  const shown = items.filter(m => S.cat === 'all' || m.category === S.cat);
  const closed = ord(v).status !== 'open';
  return vendorChips() + banner(v) + suggestion() +
    `<div class="cats"><button class="cat ${S.cat==='all'?'on':''}" data-act="cat" data-v="all">الكل</button>` +
    cats.map(c => `<button class="cat ${S.cat===c?'on':''}" data-act="cat" data-v="${esc(c)}">${esc(c)}</button>`).join('') + '</div>' +
    `<div class="grid ${closed?'disabled':''}">` +
    shown.map((m,i) => {
      const q = cartQty('m:'+m.id);
      return `<div class="item ${q?'has':''}">
        <div class="bub" style="background:${BUBBLES[i%BUBBLES.length]}">${esc(m.emoji)}</div>
        <h3>${esc(m.name)}</h3>${m.desc?`<div class="desc">${esc(m.desc)}</div>`:''}<div class="price">${fmt(m.price)}</div>
        <div class="step"><button class="m" data-act="dec" data-id="${esc(m.id)}">−</button><span>${q}</span><button data-act="inc" data-id="${esc(m.id)}">+</button></div>
      </div>`;
    }).join('') +
    `<button class="item custom" data-act="custom"><div class="bub">✍️</div>صنف تاني مش في القايمة</button></div>`;
}

/* ---------- اقتراح اليوم + السجل ---------- */
function dayDiff(a, b){ return Math.round((new Date(b) - new Date(a)) / 86400000); }
function dayLabel(d){
  const n = dayDiff(d, S.today);
  return n === 1 ? 'امبارح' : n === 2 ? 'أول امبارح' : 'يوم ' + d;
}
function lastOrder(v){ return S.hist.find(h => h.vendor === v && h.date < S.today); }
function suggestion(){
  if (!S.me || !S.today || ord(S.vendor).status !== 'open') return '';
  if (S.hist.some(h => h.vendor === S.vendor && h.date === S.today && h.round === ord(S.vendor).round)) return '';
  if (S.cart.length || load('hm_skip') === S.today + S.vendor) return '';
  const h = lastOrder(S.vendor); if (!h) return '';
  const hr = new Date().getHours();
  const hello = hr < 12 ? '☀️ صباح الفل يا ' : hr < 17 ? '🌤️ أهلاً يا ' : '🌙 مساء الخير يا ';

function reorder(h){
  if (needProfile()) return;
  if (ord(h.vendor).status !== 'open') return toast('الأوردر اتقفل 🔒', true);
  S.vendor = h.vendor; S.cat = 'all'; S.tab = 'order';
  S.cart = h.items.map((i, k) => {
    const m = S.menu.find(x => x.vendor === h.vendor && normKey(x.name) === normKey(i.item));
    return { key: m ? 'm:' + m.id : 'c:r' + k, item: i.item, emoji: m ? m.emoji : '✍️', qty: i.qty,
             estPrice: m ? m.price : i.price, note: i.note, vendor: h.vendor };
  });
  render(); reviewSheet();
}

function viewHist(){

function renderCartBar(){
  const n = S.cart.reduce((a,c) => a + c.qty, 0);
  const sum = S.cart.reduce((a,c) => a + c.qty * c.estPrice, 0);
  $('#cartbar').innerHTML = (n && S.tab === 'order')
    ? `<div class="cartbar"><div class="t">🛒 ${n} حاجة<small>تقريباً ${fmt(sum)}</small></div><button class="go" data-act="review">ضيف للأوردر ←</button></div>` : '';

function changeCart(id, d){
  const m = S.menu.find(x => x.id === id); if (!m) return;
  let c = S.cart.find(x => x.key === 'm:' + id);
  if (!c) { if (d < 0) return; c = { key:'m:'+id, item:m.name, emoji:m.emoji, qty:0, estPrice:m.price, note:'', vendor:m.vendor }; S.cart.push(c); }
  c.qty = Math.min(50, c.qty + d);
  if (c.qty <= 0) S.cart = S.cart.filter(x => x !== c);
  render();
}

/* ---------- الأوردر المجمع ---------- */
function unitPrice(l){ return l.actualPrice != null ? l.actualPrice : l.estPrice; }

function viewGroup(){
  const v = S.vendor, o = ord(v), multi = rounds(v).length > 1;
  const mine = rounds(v).flatMap(r => r.lines.filter(l => l.mine).map(l => ({ ...l, rd: r.round, open: r.status === 'open' })));
  const myTotal = mine.reduce((a,l) => a + l.qty * unitPrice(l), 0);
  const est = mine.some(l => l.actualPrice == null);
  const fee = rounds(v).reduce((a, r) => a + (r.fee > 0 && r.lines.some(l => l.mine) ? r.fee / new Set(r.lines.map(l => l.uk)).size : 0), 0);
  let html = vendorChips() + banner(v);

  html += `<div class="card"><h2>🙋 طلباتي <span class="cnt">${mine.length}</span></h2>`;
  if (!mine.length) html += `<div class="empty"><span class="e">🍽️</span>لسه مطلبتش حاجة من ${VENDORS[v].short}</div>`;
  else {
    html += mine.map(l => `<div class="row"><div class="qty">${l.qty}</div>
      <div><div class="nm">${esc(l.item)}</div>${multi?`<div class="sub">الجولة ${l.rd}</div>`:''}${l.note?`<div class="sub">📝 ${esc(l.note)}</div>`:''}</div>
      <div class="end">${fmt(l.qty*unitPrice(l))}${l.open?`<button class="x" data-act="del" data-id="${esc(l.id)}">✕</button>`:''}</div></div>`).join('');
    html += `<div class="total"><span>حسابي ${est?'<span class="pill est">تقديري</span>':'<span class="pill ok">نهائي</span>'}</span><span>${fmt(myTotal + fee)}</span></div>`;
    if (fee) html += `<div class="sub" style="margin-top:6px;font-weight:600;color:var(--muted)">شامل ${fmt(fee)} نصيبك من التوصيل 🛵</div>`;
  }
  html += '</div>';

  const groups = groupByItem(o.lines);
  html += `<div class="card"><h2>👥 الأوردر المجمع${multi?` (جولة ${o.round})`:''} <span class="cnt">${groups.reduce((a,g)=>a+g.qty,0)} حاجة</span></h2>`;
  if (!groups.length) html += `<div class="empty"><span class="e">🦗</span>لسه مفيش حد طلب… كون أول واحد!</div>`;
  else html += groups.map(g => `<div class="row" style="align-items:flex-start"><div class="qty">${g.qty}</div>
      <div style="flex:1"><div class="nm">${esc(g.item)}</div>
      <div class="chips">${g.people.map(p => `<span class="chip ${p.mine?'me':''}">${esc(p.name)} ×${p.qty}${p.note?` <small>(${esc(p.note)})</small>`:''} <small>· ${floorLabel(p.floor)}/${esc(p.office)}</small></span>`).join('')}</div></div></div>`).join('');
  html += '</div>';
  return html;
}

const isSand = (cat, name) => /س[اَ]?ندوتش/.test(cat || '') || cat === 'بيض وجبن ومقليات' || /س[اَ]?ندوتش/.test(name || '');
function catOf(l, v){
  if (l.cat) return l.cat;
  const m = S.menu.find(x => (!v || x.vendor === v) && normKey(x.name) === normKey(l.item));
  return m ? m.category : '';
}
function kindOf(g){ return isSand(g.cat, g.item) ? 'sand' : 'other'; }

function groupByItem(lines){
  const map = new Map();
  lines.forEach(l => {
    const k = normKey(l.item);
    if (!map.has(k)) map.set(k, { item:l.item, qty:0, people:[], cat: catOf(l) });
    const g = map.get(k); g.qty += l.qty;
    const p = g.people.find(x => x.uk === l.uk && x.note === l.note);
    if (p) p.qty += l.qty; else g.people.push({ uk:l.uk, name:l.name, floor:l.floor, office:l.office, qty:l.qty, note:l.note, mine:l.mine });
  });
  return [...map.values()];
}

      `<span class="chip">${esc(p.name)} ×${p.qty}${p.note?` <small>(${esc(p.note)})</small>`:''}</span>`).join('')}</div></div></div>`).join('');
  }).join('');
  html += '</div>';

  if (items.length) {
    html += `<div class="card ptable"><h2>💰 الأسعار الفعلية</h2><p class="hint" style="margin:-4px 0 6px;color:var(--muted);font-weight:600;font-size:13px">اكتب سعر الوحدة اللي دفعته وهيتحسب لكل واحد</p>`;
    html += prices.map(p => `<div class="row"><div><div class="nm">${esc(p.item)}</div><div class="sub">× ${p.qty}</div></div>
      <div class="end"><input type="number" inputmode="decimal" min="0" step="0.25" data-price="${esc(p.key)}" value="${p.value}"> ج</div></div>`).join('');
    html += `<div class="row"><div class="nm">🛵 رسوم التوصيل (بتتقسم على الكل)</div><div class="end">

      <div class="btns"><button class="btn g full" data-act="saveprices">💾 احفظ الأسعار</button></div></div>`;
    html += `<div class="card"><h2>🧾 حساب كل واحد <button class="btn sm y" style="margin-inline-start:auto" data-act="copyBills">نسخ</button></h2>

function roundsBar(v){
  const rs = rounds(v), last = ord(v), sel = cv(v), E = { open:'🟢', closed:'🛵', done:'🎉' };
  return `<div class="cats" style="margin-bottom:6px">` + rs.map(r =>
    `<button class="cat ${r.round===sel.round?'on':''}" data-act="vround" data-v="${r.round}">${E[r.status]||''} جولة ${r.round}</button>`).join('') +
    (last.status !== 'open' ? `<button class="cat" style="border-style:dashed;color:var(--purple)" data-act="newRound">➕ جولة جديدة</button>` : '') + `</div>`;
}

function vendorPrices(v){
  const map = new Map();
  cv(v).lines.forEach(l => {
    const k = normKey(l.item);
    if (!map.has(k)) map.set(k, { key:k, item:l.item, qty:0, base:null });
    const e = map.get(k); e.qty += l.qty;
    if (e.base == null) e.base = l.actualPrice != null ? l.actualPrice : l.estPrice;
  });
  const typed = S.prices[pk(v)] || {};
  return [...map.values()].map(e => ({ ...e, value: typed[e.key] !== undefined ? typed[e.key] : e.base }));
}
function effPrice(v, l){
  const t = (S.prices[pk(v)] || {})[normKey(l.item)];
  if (t !== undefined && t !== '') return Number(t) || 0;
  return unitPrice(l);
}
function billList(v){
  const o = cv(v), by = new Map();
  o.lines.forEach(l => {
    if (!by.has(l.uk)) by.set(l.uk, { uk:l.uk, name:l.name, floor:l.floor, office:l.office, lines:[], paid:true });
    const b = by.get(l.uk); b.lines.push(l); if (!l.paid) b.paid = false;
  });
  const fee = Number(S.fee[pk(v)] ?? o.fee) || 0, n = by.size || 1;
  const list = [...by.values()].map(b => {
    b.sub = b.lines.reduce((a,l) => a + l.qty * effPrice(v,l), 0);
    b.fee = fee / n; b.total = b.sub + b.fee; return b;
  });
  return list.sort((a,b) => a.floor - b.floor || String(a.office).localeCompare(String(b.office), 'ar', {numeric:true}));
}
function sumHtml(v){
  const l = billList(v), all = l.reduce((a,b) => a + b.total, 0), got = l.filter(b => b.paid).reduce((a,b) => a + b.total, 0);
  return `<div class="sum"><div style="background:#E6E0FF">إجمالي الأوردر<b>${fmt(all)}</b></div>
    <div style="background:#D9F8EE">اتحصّل<b>${fmt(got)}</b></div><div style="background:#FFE5CC">لسه<b>${fmt(all-got)}</b></div></div>`;
}
function billsHtml(v){
  return billList(v).map(b => `<div class="bill ${b.paid?'paid':''}">
    <div class="hd"><div class="loc">${floorLabel(b.floor)}<br>مكتب ${esc(b.office)}</div><div class="nm" style="font-size:16px">${esc(b.name)}</div>
    <span class="pill ${b.paid?'ok':'no'}" style="margin-inline-start:auto">${b.paid?'دفع ✅':'لسه'}</span></div>
    ${b.lines.map(l => `<div class="ln"><span>${l.qty} × ${esc(l.item)}${l.note?` <small>(${esc(l.note)})</small>`:''}</span><span>${fmt(l.qty*effPrice(v,l))}</span></div>`).join('')}
    ${b.fee?`<div class="ln"><span>🛵 توصيل</span><span>${fmt(b.fee)}</span></div>`:''}
    <div class="tot"><span>الحساب</span><span>${fmt(b.total)}</span></div>
    <div class="btns"><button class="btn sm ${b.paid?'o':'g'}" data-act="paid" data-uk="${esc(b.uk)}" data-v="${b.paid?0:1}">${b.paid?'↩️ لغي الدفع':'💵 استلمت الفلوس'}</button></div></div>`).join('');
}

function menuAdmin(v){
  const items = S.menu.filter(m => m.vendor === v);

}

/* ======================= الأحداث ======================= */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act, d = t.dataset;
  if (act === 'ovclose') { if (e.target === t) closeSheet(); return; }
  try {
    switch (act) {
      case 'tab': S.tab = d.v; render(); window.scrollTo(0,0); if (d.v !== 'courier') refresh(true); if (d.v === 'hist') loadHist(); break;
      case 'vendor': S.vendor = d.v; S.cat = 'all'; S.cart = S.cart.filter(c => c.vendor === d.v); render(); break;
      case 'cat': S.cat = d.v; render(); break;
      case 'inc': if (!needProfile()) { if (ord(S.vendor).status!=='open') return toast('الأوردر اتقفل 🔒', true); changeCart(d.id, 1); } break;
      case 'dec': changeCart(d.id, -1); break;
      case 'profile': profileSheet(!S.me); break;
      case 'saveProfile': {
        const p = { id: (S.me && S.me.id) || ('u' + Math.random().toString(36).slice(2) + Date.now().toString(36)),
          name: $('#p_name').value.trim(), floor: parseInt($('#p_floor').value, 10), office: $('#p_office').value.trim(), phone: $('#p_phone').value.trim() };
        if (!p.name) return toast('اكتب اسمك', true);
        if (!p.office) return toast('اكتب رقم المكتب', true);
        await run(call('registerUser', p));
        S.me = p; store('hm_profile', p); closeSheet(); toast('أهلاً يا ' + p.name + ' 🎉'); refresh(true); break;
      }
      case 'custom': customSheet(); break;
      case 'reorder': reorder(S.hist[+d.i]); break;
      case 'skipSuggest': store('hm_skip', S.today + S.vendor); render(); break;
      case 'addCustom': {
        const name = $('#c_name').value.trim(); if (!name) return toast('اكتب اسم الصنف', true);
        const qty = Math.max(1, Math.min(50, parseInt($('#c_qty').value, 10) || 1));
        S.cart.push({ key: 'c:' + Date.now(), item: name, emoji: '✍️', qty, estPrice: Number($('#c_price').value) || 0, note: $('#c_note').value.trim(), vendor: S.vendor });
        closeSheet(); render(); reviewSheet(); break;
      }
      case 'review': reviewSheet(); break;
      case 'cinc': S.cart[d.i].qty = Math.min(50, S.cart[d.i].qty + 1); reviewSheet(); break;
      case 'cdec': { const c = S.cart[d.i]; c.qty--; if (c.qty <= 0) S.cart.splice(d.i, 1); reviewSheet(); render(); break; }
      case 'submit': {
        const items = S.cart.map(c => ({ item: c.item, qty: c.qty, estPrice: c.estPrice, note: c.note }));
        t.disabled = true;
        try { await run(call('addLines', S.me, S.vendor, items)); }
        catch(err){ t.disabled = false; refresh(true); break; }
        S.cart = []; closeSheet(); toast('اتضاف للأوردر 🎉'); S.tab = 'group'; S._histAt = 0; await refresh(true); break;
      }
      case 'del': await run(call('deleteLine', S.me.id, d.id), 'اتمسح'); await refresh(true); break;

      case 'login': {
        const pin = $('#pin').value.trim(); if (!pin) return;
        await run(call('courierLogin', pin)); S.pin = pin; sessionSet('hm_pin', pin); render(); break;
      }
      case 'logout': S.pin = null; sessionSet('hm_pin', null); render(); break;
      case 'reload': await refresh(); toast('اتحدّث ✅'); break;
      case 'vround': S.vr[S.vendor] = +d.v; render(); break;
      case 'newRound': await courier('courierNewRound', S.vendor); S.vr[S.vendor] = null; toast('بدأت جولة جديدة 🟢'); await refresh(true); break;
      case 'status': await courier('courierSetStatus', S.vendor, d.v, cv(S.vendor).round); await refresh(true); break;
      case 'saveprices': await savePrices(); toast('اتحفظ ✅'); await refresh(true); break;
      case 'paid': await courier('courierSetPaid', S.vendor, d.uk, d.v === '1', cv(S.vendor).round); await refresh(true); break;
      case 'copyList': copyText(listText()); break;
      case 'copyBills': copyText(billsText()); break;
      case 'addMenu': menuSheet(); break;
      case 'editMenu': menuSheet(S.menu.find(m => m.id === d.id)); break;
      case 'saveMenu': {
        const m = { id: d.id || '', vendor: S.vendor, name: $('#m_name').value, price: $('#m_price').value, emoji: $('#m_emoji').value, category: $('#m_cat').value, desc: $('#m_desc').value };
        await courier('courierSaveMenuItem', m); closeSheet(); toast('اتحفظ ✅'); await refresh(true); break;
      }
      case 'delMenu': if (confirm('تمسح الصنف ده من المنيو؟')) { await courier('courierDeleteMenuItem', d.id); await refresh(true); } break;
    }
  } catch(err) { /* اتعرضت في run() */ }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.price !== undefined) { (S.prices[pk(S.vendor)] = S.prices[pk(S.vendor)] || {})[t.dataset.price] = t.value; liveBills(); }
  else if (t.id === 'fee') { S.fee[pk(S.vendor)] = t.value; liveBills(); }
  else if (t.dataset.note !== undefined) S.cart[t.dataset.note].note = t.value;
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'pin') document.querySelector('[data-act=login]').click(); });

function liveBills(){ const v = S.vendor; if ($('#bills')) { $('#bills').innerHTML = billsHtml(v); $('#sum').innerHTML = sumHtml(v); } }

async function courier(fn, ...args){
  try { return await run(call(fn, S.pin, ...args)); }
  catch(e){ if (e.message === 'الكود غلط') { S.pin = null; sessionSet('hm_pin', null); render(); } throw e; }
}
async function savePrices(){
  const v = S.vendor, prices = {};
  vendorPrices(v).forEach(p => { prices[p.key] = Number(p.value) || 0; });
  const k = pk(v), rd = cv(v).round;
  await courier('courierSave', v, prices, Number(S.fee[k] ?? cv(v).fee) || 0, rd);
  delete S.prices[k]; delete S.fee[k];
}

function listText(){
  const v = S.vendor;
  const gs = groupByItem(cv(v).lines);
  const sec = (k, t) => { const a = gs.filter(g => kindOf(g) === k); return a.length ? `\n${t}:\n` + a.map(g => `• ${g.item} × ${g.qty}`).join('\n') : ''; };
  return `طلب ${VENDORS[v].name}${rounds(v).length>1?' (جولة '+cv(v).round+')':''}:` + sec('sand', '🥙 سندوتشات') + sec('other', '🍽️ أطباق وطلبات تانية');
}
function billsText(){
  const v = S.vendor;
  return `حساب ${VENDORS[v].short} — هاتلى معاك 🛵\n` + billList(v).map(b =>
    `${b.paid?'✅':'⬜'} ${b.name} (${floorLabel(b.floor)} / ${b.office}): ${fmt(b.total)}`).join('\n');
}

/* ======================= تشغيل ======================= */
render();
refresh();
if (!S.me) setTimeout(() => profileSheet(true), 400);
setInterval(() => {
  const f = document.activeElement;
  if (document.hidden || S._lock || (f && /INPUT|TEXTAREA|SELECT/.test(f.tagName))) return;
  refresh(true);
}, 25000);
</script>
